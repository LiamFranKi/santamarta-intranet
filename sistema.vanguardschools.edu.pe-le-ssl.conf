<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName sistema.vanguardschools.edu.pe
    ServerAlias 89.117.52.9

    # Frontend React - Servir archivos estáticos
    DocumentRoot /home/vanguard/intranet2026/frontend/build

    # Iconos PWA - AGREGADO PARA CORREGIR ERROR 404
    Alias /icons /home/vanguard/intranet2026/frontend/build/icons
    <Directory /home/vanguard/intranet2026/frontend/build/icons>
        Options -Indexes
        Require all granted
    </Directory>

    <Directory /home/vanguard/intranet2026/frontend/build>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # React Router - Redirigir todas las rutas a index.html
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Backend API - Proxy a Node.js en puerto 5000
    ProxyPreserveHost On
    ProxyRequests Off

    <Location /api>
        ProxyPass http://localhost:5000/api
        ProxyPassReverse http://localhost:5000/api
    </Location>

    # Archivos subidos
    Alias /uploads /home/vanguard/intranet2026/backend/uploads
    <Directory /home/vanguard/intranet2026/backend/uploads>
        Options -Indexes
        Require all granted
    </Directory>

    # Assets del backend
    Alias /assets /home/vanguard/intranet2026/backend/public/assets
    <Directory /home/vanguard/intranet2026/backend/public/assets>
        Options -Indexes
        Require all granted
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/sistema-error.log
    CustomLog ${APACHE_LOG_DIR}/sistema-access.log combined

SSLCertificateFile /etc/letsencrypt/live/sistema.vanguardschools.edu.pe/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/sistema.vanguardschools.edu.pe/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>

